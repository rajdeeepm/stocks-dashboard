<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quant Terminal — Live Market Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: #f0eee9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Fill the artboard with the dashboard */
    .dash-root { width: 100%; height: 100%; }
    /* Smaller scrollbars within dashboards */
    .dash-root *::-webkit-scrollbar { width: 6px; height: 6px; }
    .dash-root *::-webkit-scrollbar-track { background: transparent; }
    .dash-root *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    /* Hover for sortable headers */
    .dash-root button:hover { filter: brightness(1.2); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script src="themes.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="chart.jsx"></script>
  <script type="text/babel" src="panels.jsx"></script>
  <script type="text/babel" src="dashboard.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const { useState } = React;

    const ARTBOARD_W = 1920;
    const ARTBOARD_H = 1400;

    function App() {
      const T = window.Themes;
      return (
        <DesignCanvas>
          <DCSection id="terminals" title="Quant Terminal — 3 aesthetic directions"
            subtitle="A featured-ticker (NVDA by default) terminal packed with 16 modules. Each artboard is fully interactive: switch tickers, toggle indicators, sort tables, change time ranges. Open any artboard fullscreen via ⤢ or arrow-keys (←/→).">

            <DCArtboard id="phosphor" label="A · PHOSPHOR  (Amber CRT)"
              width={ARTBOARD_W} height={ARTBOARD_H}
              style={{ background: T.phosphor.bg }}>
              <div className="dash-root">
                <Dashboard theme={T.phosphor} initialTicker="NVDA" />
              </div>
            </DCArtboard>

            <DCArtboard id="quantlab" label="B · QUANT/LAB  (Cyan · Magenta)"
              width={ARTBOARD_W} height={ARTBOARD_H}
              style={{ background: T.quantlab.bg }}>
              <div className="dash-root">
                <Dashboard theme={T.quantlab} initialTicker="NVDA" />
              </div>
            </DCArtboard>

            <DCArtboard id="carbon" label="C · CARBON/WIRE  (Slate · Lime)"
              width={ARTBOARD_W} height={ARTBOARD_H}
              style={{ background: T.carbon.bg }}>
              <div className="dash-root">
                <Dashboard theme={T.carbon} initialTicker="NVDA" />
              </div>
            </DCArtboard>

          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
